apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('app/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk = 37
    defaultConfig {
        applicationId "gis2018.udacity.tametu"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 4
        versionName "1.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding = true
    }
    namespace = 'gis2018.udacity.tametu'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // Bumped from 1.0.2: the old version predates registerForActivityResult()/ActivityResultContracts,
    // which MainActivity now needs to request the POST_NOTIFICATIONS runtime permission.
    // minSdkVersion raised to 23 to allow appcompat 1.8.0 (which requires API 23+).
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    // LocalBroadcastManager used to ship transitively via appcompat's legacy-support-v4
    // dependency; newer appcompat versions dropped that, so it must be declared directly.
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    // ButterKnife removed (unmaintained since 2020; also required final resource IDs, which
    // blocked upgrading to AGP 9.x). Views are now bound via ViewBinding instead.
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
